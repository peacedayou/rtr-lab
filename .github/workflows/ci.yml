name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: "Tests unitaires et d'intégration (Testcontainers, PostgreSQL et Kafka)"
        run: mvn -B verify

  demo-docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Démarrer la démo (docker compose)
        run: docker compose up --build -d
      - name: Attendre l'application
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 3
          done
          docker compose logs app; exit 1
      - name: Envoyer le lot d'exemple
        run: |
          curl -sf -X POST -H "Content-Type: application/xml" \
            --data-binary @src/main/resources/exemples/pacs008-lot.xml \
            http://localhost:8080/api/pacs008 | tee pacs002.xml
          grep -q "<GrpSts>PART</GrpSts>" pacs002.xml
      - name: Rapprochement équilibré
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/api/rapprochement | tee rapport.json
            grep -q '"RAPPROCHE"' rapport.json && ! grep -q 'MANQUANT\|DIFFERENT\|INATTENDU\|DOUBLE' rapport.json && exit 0
            sleep 2
          done
          exit 1
      - if: always()
        run: docker compose down -v
