# Démo complète : docker compose up --build, puis
#   curl -s -X POST -H "Content-Type: application/xml" --data-binary @src/main/resources/exemples/pacs008-lot.xml http://localhost:8080/api/pacs008
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rtrlab
      POSTGRES_USER: rtrlab
      POSTGRES_PASSWORD: rtrlab   # mot de passe de démonstration, réseau local seulement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtrlab"]
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/rtrlab
      DATABASE_USER: rtrlab
      DATABASE_PASSWORD: rtrlab
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8080:8080"
